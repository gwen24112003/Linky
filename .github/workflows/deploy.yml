# Deploiement continu d'opusadvisor.fr (mode "pull").
#
# A chaque push sur main, GitHub compile le site et publie le resultat (out/)
# dans la branche "deploy". Le VPS verifie cette branche toutes les 2 minutes
# (infra/opus-pull.sh, minuterie systemd) et bascule le site s'il a change.
#
# Aucun secret requis : le depot est public et la publication utilise le
# GITHUB_TOKEN fourni automatiquement. Une compilation en echec ne publie rien,
# le site en ligne reste sur la version precedente.

name: Build & publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publier out/ dans la branche deploy
        env:
          # Passe par l'environnement : jamais interpole directement dans le script.
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f out/index.html
          cd out
          git init -q
          git checkout -q -b deploy
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "deploy ${GITHUB_SHA::7}: ${COMMIT_MSG%%$'\n'*}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
