# /etc/nginx/snippets/umami-proxy.conf, inclus dans le vhost opusadvisor.fr.
# Le script et l'envoi des mesures passent par le domaine du site : pas de requête vers un tiers.
location = /s.js {
    proxy_pass http://127.0.0.1:3100/script.js;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=86400";
}

location = /api/send {
    proxy_pass http://127.0.0.1:3100/api/send;
    proxy_set_header Host $host;
    # Écrase (n'ajoute pas) l'en-tête : un visiteur ne peut pas se faire passer pour une autre IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
}
