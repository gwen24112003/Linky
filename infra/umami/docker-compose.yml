# Mesure d'audience Umami, auto-hébergée sur le VPS (/srv/umami).
# Les secrets (DB_PASSWORD, APP_SECRET) sont dans /srv/umami/.env, générés sur le serveur, jamais versionnés.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10

  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${DB_PASSWORD}@db:5432/umami
      APP_SECRET: ${APP_SECRET}
      DISABLE_TELEMETRY: 1
    # Uniquement en local : nginx fait l'intermédiaire (opusadvisor.fr/s.js, /api/send et stats.opusadvisor.fr).
    ports:
      - "127.0.0.1:3100:3000"

volumes:
  db:
