# /etc/nginx/snippets/lead-api-proxy.conf, inclus dans le vhost opusadvisor.fr (à côté de umami-proxy.conf).
# Le diagnostic facture électronique envoie ses leads sur le domaine du site : pas de CORS, pas de tiers.
location /api/diagnostic-lead {
    proxy_pass http://127.0.0.1:3101;
    proxy_set_header Host $host;
    # Écrase (n'ajoute pas) l'en-tête : un visiteur ne peut pas se faire passer pour une autre IP
    # et contourner la limite de 5 envois par heure.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 16k;
    proxy_read_timeout 60s;
    include snippets/security-headers.conf;
}
