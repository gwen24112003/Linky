# Snippet Nginx — redirections 301 pour Opus Advisor
#
# À inclure dans le `server { ... }` qui sert /var/www/linky/out
# (ex: /etc/nginx/sites-available/opusadvisor.fr).
#
# Pourquoi : la route article a été migrée du singulier (/article/[slug])
# vers le pluriel (/articles/[slug]) le 2026-05-02. Ces 301 préservent
# le SEO de ce qui a déjà pu être indexé sur l'ancien chemin.
#
# Important : ces directives `location` doivent être déclarées AVANT
# le `location /` qui sert les fichiers statiques, sinon elles ne sont
# jamais matchées.

# /article/<slug>     → /articles/<slug>/  (301)
# /article/<slug>/    → /articles/<slug>/  (301)
location ~ ^/article/(?<article_slug>[^/]+)/?$ {
    return 301 /articles/$article_slug/;
}

# Test après reload nginx :
#   curl -I https://opusadvisor.fr/article/relances-automatiques-impayes-btp
#   → doit renvoyer "HTTP/2 301" + "location: /articles/relances-automatiques-impayes-btp/"
