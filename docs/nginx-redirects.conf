# Snippet Nginx — redirections 301 pour Opus Advisor
#
# Installé sur le VPS OVH sous /etc/nginx/snippets/opus-redirects.conf et inclus
# dans le vhost opusadvisor.fr (`include snippets/opus-redirects.conf;`).
#
# Pourquoi : la route article a été migrée du singulier (/article/[slug])
# vers le pluriel (/articles/[slug]) le 2026-05-02. Ces 301 préservent
# le SEO de ce qui a déjà pu être indexé sur l'ancien chemin.
#
# Important : ces directives `location` doivent être déclarées AVANT
# le `location /` qui sert les fichiers statiques, sinon elles ne sont
# jamais matchées.

# Articles supprimés : rediriger vers l'article le plus proche plutôt que vers un 404.
# (les `location =` exactes ont priorité sur la regex générique ci-dessous)
# - ia-pme-par-ou-commencer : article purgé, encore connu de Google (404 signalés en octobre 2026).
location = /article/ia-pme-par-ou-commencer  { return 301 /articles/ia-btp-donnees-propres/; }
location = /article/ia-pme-par-ou-commencer/ { return 301 /articles/ia-btp-donnees-propres/; }
location = /articles/ia-pme-par-ou-commencer  { return 301 /articles/ia-btp-donnees-propres/; }
location = /articles/ia-pme-par-ou-commencer/ { return 301 /articles/ia-btp-donnees-propres/; }

# Page locale devenue générale le 22/10/2026 (n'est plus réservée au BTP).
location = /consultant-btp-rennes  { return 301 /consultant-rennes/; }
location = /consultant-btp-rennes/ { return 301 /consultant-rennes/; }

# /article/<slug>     → /articles/<slug>/  (301)
# /article/<slug>/    → /articles/<slug>/  (301)
location ~ ^/article/(?<article_slug>[^/]+)/?$ {
    return 301 /articles/$article_slug/;
}

# Test après reload nginx :
#   curl -I https://opusadvisor.fr/article/relances-automatiques-impayes-btp
#   → doit renvoyer "HTTP/2 301" + "location: /articles/relances-automatiques-impayes-btp/"
